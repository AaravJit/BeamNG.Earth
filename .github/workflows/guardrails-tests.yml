name: Guardrail tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mapped-guardrails
  pull_request:
    paths:
      - "server/guardrails.py"
      - "server/roadmesh.py"
      - "server/tests/test_guardrails.py"
      - "server/tests/test_roadmesh.py"
      - "server/tests/test_roads.py"
      - "server/roads.py"
      - "server/blockworker.py"
      - "server/earthd.py"
      - "server/junctions.py"
      - "server/mapcells.py"
      - "server/mapgeom.py"
      - "server/geodesy.py"
      - "server/staging.py"
      - "mod/beamng_earth/lua/ge/extensions/beamngEarth/roads.lua"
      - "mod/beamng_earth/lua/ge/extensions/beamngEarth/trees.lua"
      - ".github/workflows/guardrails-tests.yml"

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile changed Python modules
        run: python -m py_compile server/guardrails.py server/roadmesh.py server/roads.py server/blockworker.py server/earthd.py
      - name: Run guardrail tests
        run: python -m unittest discover -s server/tests -p "test_guardrails.py" -v
      - name: Run road mesh tests
        run: python -m unittest discover -s server/tests -p "test_roadmesh.py" -v
